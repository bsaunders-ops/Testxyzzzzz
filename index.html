<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Grady's Dino">
    <title>Grady's Dinosaur Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            user-select: none;
            -webkit-user-select: none;
        }

        .game-wrapper {
            text-align: center;
            width: 100%;
            max-width: 840px;
            padding: 8px;
        }

        h1 {
            color: #e94560;
            font-size: 1.4rem;
            margin-bottom: 4px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }

        .subtitle {
            color: #f5a623;
            font-size: 0.75rem;
            margin-bottom: 8px;
        }

        #gameCanvas {
            border: 3px solid #e94560;
            border-radius: 8px;
            background: #87CEEB;
            display: block;
            margin: 0 auto;
            cursor: pointer;
            width: 100%;
            max-width: 800px;
            touch-action: none;
        }

        /* ---- TOUCH CONTROLS ---- */
        .touch-controls {
            display: none;
            width: 100%;
            max-width: 800px;
            margin: 10px auto 0;
            gap: 12px;
            justify-content: center;
            padding: 0 10px;
        }

        .touch-btn {
            flex: 1;
            max-width: 200px;
            height: 70px;
            border: 3px solid;
            border-radius: 16px;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.05s;
        }

        .touch-btn:active {
            transform: scale(0.95);
        }

        .btn-jump {
            background: rgba(46, 204, 113, 0.25);
            border-color: #2ecc71;
            color: #2ecc71;
        }

        .btn-jump:active {
            background: rgba(46, 204, 113, 0.5);
        }

        .btn-duck {
            background: rgba(243, 156, 18, 0.25);
            border-color: #f39c12;
            color: #f39c12;
        }

        .btn-duck:active {
            background: rgba(243, 156, 18, 0.5);
        }

        .btn-icon {
            font-size: 1.6rem;
        }

        .controls-info {
            color: #aaa;
            font-size: 0.7rem;
            margin-top: 8px;
        }

        .controls-info span {
            color: #e94560;
            font-weight: bold;
        }

        /* Show touch controls on touch devices */
        @media (pointer: coarse) {
            .touch-controls {
                display: flex;
            }
            .controls-info {
                display: none;
            }
        }

        /* Smaller screens */
        @media (max-width: 500px) {
            h1 { font-size: 1.1rem; }
            .subtitle { font-size: 0.65rem; }
            .game-wrapper { padding: 4px; }
            .touch-btn {
                height: 60px;
                font-size: 1rem;
                border-radius: 12px;
            }
        }

        /* Landscape phone - maximize game area */
        @media (max-height: 450px) and (orientation: landscape) {
            h1, .subtitle { display: none; }
            .game-wrapper { padding: 2px; }
            .touch-controls { margin-top: 4px; gap: 8px; }
            .touch-btn { height: 50px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <h1>Grady's Dinosaur Adventure</h1>
        <p class="subtitle">Help Grady run through the land of dinosaurs!</p>
        <canvas id="gameCanvas" width="800" height="300"></canvas>
        <div class="touch-controls">
            <button class="touch-btn btn-jump" id="btnJump">
                <span class="btn-icon">&#8593;</span> JUMP
            </button>
            <button class="touch-btn btn-duck" id="btnDuck">
                <span class="btn-icon">&#8595;</span> DUCK
            </button>
        </div>
        <p class="controls-info">Press <span>SPACE</span> to jump &mdash; <span>DOWN ARROW</span> to duck</p>
    </div>

    <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const btnJump = document.getElementById('btnJump');
    const btnDuck = document.getElementById('btnDuck');

    // Game constants
    const GROUND_Y = 240;
    const GRAVITY = 0.6;
    const JUMP_FORCE = -12;
    const INITIAL_SPEED = 5;
    const MAX_SPEED = 12;

    // Game state
    let gameState = 'start'; // start, playing, gameover
    let score = 0;
    let highScore = 0;
    let speed = INITIAL_SPEED;
    let frameCount = 0;
    let isTouchDevice = false;

    // Detect touch device
    function detectTouch() {
        isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    }
    detectTouch();

    // Clouds
    let clouds = [
        { x: 100, y: 40, size: 1 },
        { x: 350, y: 60, size: 0.7 },
        { x: 600, y: 30, size: 1.2 },
    ];

    // Ground tiles
    let groundOffset = 0;

    // Stars (for decoration)
    let stars = [];
    for (let i = 0; i < 5; i++) {
        stars.push({ x: Math.random() * 800, y: Math.random() * 80 + 10 });
    }

    // ---- GRADY (the little boy) ----
    const grady = {
        x: 80,
        y: GROUND_Y,
        width: 32,
        height: 48,
        vy: 0,
        isJumping: false,
        isDucking: false,
        runFrame: 0,
        runTimer: 0,

        reset() {
            this.y = GROUND_Y;
            this.vy = 0;
            this.isJumping = false;
            this.isDucking = false;
            this.runFrame = 0;
        },

        jump() {
            if (!this.isJumping) {
                this.vy = JUMP_FORCE;
                this.isJumping = true;
            }
        },

        duck(active) {
            this.isDucking = active && !this.isJumping;
        },

        update() {
            this.vy += GRAVITY;
            this.y += this.vy;

            if (this.y >= GROUND_Y) {
                this.y = GROUND_Y;
                this.vy = 0;
                this.isJumping = false;
            }

            this.runTimer++;
            if (this.runTimer > 6) {
                this.runTimer = 0;
                this.runFrame = (this.runFrame + 1) % 4;
            }
        },

        getHitbox() {
            if (this.isDucking) {
                return { x: this.x, y: this.y + 20, w: 36, h: 28 };
            }
            return { x: this.x + 4, y: this.y, w: 24, h: 48 };
        },

        draw() {
            const x = this.x;
            const y = this.y;

            ctx.save();

            if (this.isDucking) {
                ctx.fillStyle = '#4a90d9';
                ctx.fillRect(x, y + 24, 36, 14);

                ctx.fillStyle = '#ffcc99';
                ctx.beginPath();
                ctx.arc(x + 32, y + 26, 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.arc(x + 32, y + 22, 7, Math.PI, 2 * Math.PI);
                ctx.fill();

                ctx.fillStyle = '#333';
                ctx.fillRect(x + 35, y + 25, 2, 2);

                ctx.fillStyle = '#555';
                ctx.fillRect(x + 2, y + 38, 10, 6);
                ctx.fillRect(x + 14, y + 38, 10, 6);

                ctx.fillStyle = '#e94560';
                ctx.fillRect(x, y + 42, 10, 4);
                ctx.fillRect(x + 12, y + 42, 10, 4);
            } else {
                ctx.fillStyle = '#4a90d9';
                ctx.fillRect(x + 8, y + 16, 16, 16);

                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(x + 12, y + 20, 8, 6);
                ctx.fillStyle = '#27ae60';
                ctx.fillRect(x + 14, y + 18, 4, 2);
                ctx.fillRect(x + 11, y + 22, 2, 2);

                ctx.fillStyle = '#ffcc99';
                ctx.beginPath();
                ctx.arc(x + 16, y + 10, 10, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.arc(x + 16, y + 6, 9, Math.PI, 2 * Math.PI);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x + 12, y + 0);
                ctx.lineTo(x + 16, y + 4);
                ctx.lineTo(x + 20, y - 1);
                ctx.fill();

                ctx.fillStyle = '#333';
                if (gameState === 'gameover') {
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#333';
                    ctx.beginPath();
                    ctx.moveTo(x + 19, y + 8);
                    ctx.lineTo(x + 23, y + 12);
                    ctx.moveTo(x + 23, y + 8);
                    ctx.lineTo(x + 19, y + 12);
                    ctx.stroke();
                } else {
                    ctx.fillRect(x + 20, y + 9, 3, 3);
                }

                if (gameState !== 'gameover') {
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(x + 18, y + 13, 4, 0.1, Math.PI - 0.1);
                    ctx.stroke();
                } else {
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(x + 18, y + 18, 4, Math.PI + 0.3, -0.3);
                    ctx.stroke();
                }

                ctx.fillStyle = '#ffcc99';
                const armSwing = this.isJumping ? -30 : Math.sin(this.runFrame * Math.PI / 2) * 20;
                ctx.save();
                ctx.translate(x + 10, y + 18);
                ctx.rotate((armSwing - 10) * Math.PI / 180);
                ctx.fillRect(-2, 0, 4, 12);
                ctx.restore();

                ctx.save();
                ctx.translate(x + 22, y + 18);
                ctx.rotate((-armSwing - 10) * Math.PI / 180);
                ctx.fillRect(-2, 0, 4, 12);
                ctx.restore();

                ctx.fillStyle = '#555';
                ctx.fillRect(x + 8, y + 30, 16, 6);

                ctx.fillStyle = '#ffcc99';
                if (this.isJumping) {
                    ctx.fillRect(x + 8, y + 36, 6, 8);
                    ctx.fillRect(x + 18, y + 36, 6, 8);
                } else {
                    const legOffset = Math.sin(this.runFrame * Math.PI / 2) * 5;
                    ctx.fillRect(x + 9, y + 36, 5, 8 + legOffset);
                    ctx.fillRect(x + 18, y + 36, 5, 8 - legOffset);
                }

                ctx.fillStyle = '#e94560';
                if (this.isJumping) {
                    ctx.fillRect(x + 7, y + 44, 8, 4);
                    ctx.fillRect(x + 17, y + 44, 8, 4);
                } else {
                    const legOffset = Math.sin(this.runFrame * Math.PI / 2) * 5;
                    ctx.fillRect(x + 7, y + 44 + legOffset, 8, 4);
                    ctx.fillRect(x + 17, y + 44 - legOffset, 8, 4);
                }
            }

            ctx.restore();
        }
    };

    // ---- OBSTACLES (Dinosaurs!) ----
    let obstacles = [];

    function createDino(type) {
        if (type === 'small') {
            return {
                type: 'small', x: 820, y: GROUND_Y + 8,
                width: 30, height: 40, frame: 0, frameTimer: 0,
            };
        } else if (type === 'big') {
            return {
                type: 'big', x: 820, y: GROUND_Y - 12,
                width: 50, height: 60, frame: 0, frameTimer: 0,
            };
        } else if (type === 'flying') {
            const flyY = Math.random() > 0.5 ? GROUND_Y - 30 : GROUND_Y - 60;
            return {
                type: 'flying', x: 820, y: flyY,
                width: 40, height: 30, frame: 0, frameTimer: 0,
            };
        }
    }

    function drawDino(obs) {
        const x = obs.x;
        const y = obs.y;

        obs.frameTimer++;
        if (obs.frameTimer > 8) {
            obs.frameTimer = 0;
            obs.frame = (obs.frame + 1) % 2;
        }

        ctx.save();

        if (obs.type === 'small') {
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(x + 5, y + 8, 18, 14);
            ctx.fillRect(x + 20, y + 2, 12, 10);
            ctx.fillStyle = '#c0392b';
            ctx.fillRect(x + 27, y + 4, 3, 3);
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(x + 22, y + 10, 10, 3);
            ctx.fillStyle = 'white';
            ctx.fillRect(x + 24, y + 10, 2, 2);
            ctx.fillRect(x + 28, y + 10, 2, 2);
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(x, y + 6, 8, 6);
            ctx.fillRect(x - 4, y + 4, 6, 4);
            ctx.fillStyle = '#27ae60';
            if (obs.frame === 0) {
                ctx.fillRect(x + 8, y + 22, 4, 10);
                ctx.fillRect(x + 18, y + 22, 4, 8);
            } else {
                ctx.fillRect(x + 8, y + 22, 4, 8);
                ctx.fillRect(x + 18, y + 22, 4, 10);
            }
            ctx.fillRect(x + 20, y + 14, 3, 5);
            ctx.fillStyle = '#f39c12';
            ctx.fillRect(x + 10, y + 6, 3, 3);
            ctx.fillRect(x + 16, y + 5, 3, 4);
        } else if (obs.type === 'big') {
            ctx.fillStyle = '#8e44ad';
            ctx.fillRect(x + 8, y + 12, 30, 24);
            ctx.fillRect(x + 32, y + 2, 18, 18);
            ctx.fillRect(x + 35, y + 16, 16, 8);
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(x + 42, y + 6, 4, 4);
            ctx.fillStyle = '#333';
            ctx.fillRect(x + 43, y + 7, 2, 2);
            ctx.fillStyle = 'white';
            for (let i = 0; i < 4; i++) {
                ctx.fillRect(x + 37 + i * 4, y + 16, 2, 3);
            }
            ctx.fillStyle = '#8e44ad';
            ctx.fillRect(x, y + 8, 12, 10);
            ctx.fillRect(x - 6, y + 4, 10, 8);
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(x + 14, y + 8, 4, 5);
            ctx.fillRect(x + 22, y + 7, 4, 6);
            ctx.fillRect(x + 30, y + 9, 4, 4);
            ctx.fillStyle = '#7d3c98';
            if (obs.frame === 0) {
                ctx.fillRect(x + 14, y + 36, 6, 16);
                ctx.fillRect(x + 28, y + 36, 6, 14);
            } else {
                ctx.fillRect(x + 14, y + 36, 6, 14);
                ctx.fillRect(x + 28, y + 36, 6, 16);
            }
            ctx.fillRect(x + 12, y + 50, 10, 4);
            ctx.fillRect(x + 26, y + 48, 10, 4);
            ctx.fillStyle = '#9b59b6';
            ctx.fillRect(x + 34, y + 22, 4, 7);
            ctx.fillRect(x + 36, y + 28, 3, 2);
        } else if (obs.type === 'flying') {
            ctx.fillStyle = '#e67e22';
            ctx.fillRect(x + 12, y + 10, 16, 10);
            ctx.fillRect(x + 26, y + 8, 10, 8);
            ctx.fillStyle = '#f39c12';
            ctx.fillRect(x + 34, y + 10, 8, 4);
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.moveTo(x + 28, y + 8);
            ctx.lineTo(x + 24, y);
            ctx.lineTo(x + 32, y + 8);
            ctx.fill();
            ctx.fillStyle = '#333';
            ctx.fillRect(x + 30, y + 10, 2, 2);
            ctx.fillStyle = '#d35400';
            if (obs.frame === 0) {
                ctx.beginPath();
                ctx.moveTo(x + 14, y + 10);
                ctx.lineTo(x, y - 6);
                ctx.lineTo(x + 24, y + 10);
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.moveTo(x + 14, y + 10);
                ctx.lineTo(x, y + 22);
                ctx.lineTo(x + 24, y + 10);
                ctx.fill();
            }
            ctx.fillStyle = '#e67e22';
            ctx.fillRect(x + 4, y + 12, 10, 5);
        }

        ctx.restore();
    }

    function getObsHitbox(obs) {
        if (obs.type === 'small') {
            return { x: obs.x + 4, y: obs.y + 2, w: 26, h: 36 };
        } else if (obs.type === 'big') {
            return { x: obs.x + 6, y: obs.y + 4, w: 44, h: 50 };
        } else if (obs.type === 'flying') {
            return { x: obs.x + 8, y: obs.y + 4, w: 30, h: 20 };
        }
    }

    function checkCollision(a, b) {
        return a.x < b.x + b.w &&
               a.x + a.w > b.x &&
               a.y < b.y + b.h &&
               a.y + a.h > b.y;
    }

    // ---- SCENERY ----
    let mountains = [
        { x: 0, h: 60, color: '#6b8a7a' },
        { x: 150, h: 80, color: '#5a7d6a' },
        { x: 350, h: 50, color: '#7a9a8a' },
        { x: 500, h: 70, color: '#5a7d6a' },
        { x: 700, h: 55, color: '#6b8a7a' },
    ];

    let bushes = [];
    for (let i = 0; i < 6; i++) {
        bushes.push({ x: Math.random() * 800, size: 8 + Math.random() * 12 });
    }

    let particles = [];

    function spawnDust() {
        if (!grady.isJumping && !grady.isDucking && frameCount % 4 === 0) {
            particles.push({
                x: grady.x + 10, y: GROUND_Y + 46,
                vx: -Math.random() * 2 - 1, vy: -Math.random() * 1.5,
                life: 15, size: 2 + Math.random() * 3,
            });
        }
    }

    function drawSky() {
        const gradient = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
        gradient.addColorStop(0, '#87CEEB');
        gradient.addColorStop(1, '#b8e6f0');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 800, GROUND_Y);
    }

    function drawClouds() {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        clouds.forEach(cloud => {
            const s = cloud.size;
            ctx.beginPath();
            ctx.arc(cloud.x, cloud.y, 15 * s, 0, Math.PI * 2);
            ctx.arc(cloud.x + 15 * s, cloud.y - 5 * s, 12 * s, 0, Math.PI * 2);
            ctx.arc(cloud.x + 30 * s, cloud.y, 10 * s, 0, Math.PI * 2);
            ctx.arc(cloud.x - 10 * s, cloud.y + 2, 8 * s, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function drawMountains() {
        mountains.forEach(m => {
            ctx.fillStyle = m.color;
            ctx.beginPath();
            ctx.moveTo(m.x - 60, GROUND_Y);
            ctx.lineTo(m.x + 30, GROUND_Y - m.h);
            ctx.lineTo(m.x + 120, GROUND_Y);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.beginPath();
            ctx.moveTo(m.x + 15, GROUND_Y - m.h + 10);
            ctx.lineTo(m.x + 30, GROUND_Y - m.h);
            ctx.lineTo(m.x + 45, GROUND_Y - m.h + 10);
            ctx.fill();
        });
    }

    function drawGround() {
        ctx.fillStyle = '#8B7355';
        ctx.fillRect(0, GROUND_Y + 48, 800, 60);

        ctx.fillStyle = '#4CAF50';
        ctx.fillRect(0, GROUND_Y + 46, 800, 8);

        ctx.fillStyle = '#66BB6A';
        for (let i = 0; i < 80; i++) {
            const gx = ((i * 10 + groundOffset) % 820) - 10;
            ctx.fillRect(gx, GROUND_Y + 43, 2, 6);
        }

        ctx.fillStyle = '#7a6545';
        for (let i = 0; i < 40; i++) {
            const gx = ((i * 20 + groundOffset * 0.5) % 840) - 20;
            ctx.fillRect(gx, GROUND_Y + 56 + (i % 3) * 8, 6, 2);
        }

        bushes.forEach(bush => {
            ctx.fillStyle = '#388E3C';
            const bx = ((bush.x + groundOffset * 0.3) % 840) - 20;
            ctx.beginPath();
            ctx.arc(bx, GROUND_Y + 46, bush.size, Math.PI, 0);
            ctx.fill();
            ctx.fillStyle = '#43A047';
            ctx.beginPath();
            ctx.arc(bx + bush.size * 0.3, GROUND_Y + 44, bush.size * 0.6, Math.PI, 0);
            ctx.fill();
        });
    }

    function drawParticles() {
        particles.forEach(p => {
            ctx.fillStyle = `rgba(180, 160, 130, ${p.life / 15})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function drawScore() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.roundRect(640, 8, 150, 40, 8);
        ctx.fill();

        ctx.fillStyle = 'white';
        ctx.font = 'bold 16px "Courier New"';
        ctx.textAlign = 'right';
        ctx.fillText(`HI ${String(highScore).padStart(5, '0')}`, 780, 28);
        ctx.fillText(`${String(score).padStart(5, '0')}`, 780, 44);
        ctx.textAlign = 'left';
    }

    function drawStartScreen() {
        drawSky();
        drawMountains();
        drawClouds();
        drawGround();
        grady.draw();

        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.roundRect(150, 60, 500, 140, 16);
        ctx.fill();

        ctx.fillStyle = '#f5a623';
        ctx.font = 'bold 28px "Courier New"';
        ctx.textAlign = 'center';
        ctx.fillText("GRADY'S DINO ADVENTURE", 400, 100);

        ctx.fillStyle = '#fff';
        ctx.font = '16px "Courier New"';
        ctx.fillText('Help Grady run through', 400, 135);
        ctx.fillText('the land of dinosaurs!', 400, 155);

        ctx.fillStyle = '#e94560';
        ctx.font = 'bold 18px "Courier New"';
        const startText = isTouchDevice ? 'Tap to Start!' : 'Press SPACE to Start';
        ctx.fillText(startText, 400, 185);
        ctx.textAlign = 'left';
    }

    function drawGameOver() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.roundRect(200, 70, 400, 130, 16);
        ctx.fill();

        ctx.fillStyle = '#e94560';
        ctx.font = 'bold 28px "Courier New"';
        ctx.textAlign = 'center';
        ctx.fillText('OH NO!', 400, 105);

        ctx.fillStyle = '#fff';
        ctx.font = '16px "Courier New"';
        ctx.fillText(`Grady scored: ${score} points!`, 400, 140);

        ctx.fillStyle = '#f5a623';
        ctx.font = 'bold 16px "Courier New"';
        const retryText = isTouchDevice ? 'Tap to Try Again!' : 'Press SPACE to Try Again';
        ctx.fillText(retryText, 400, 175);
        ctx.textAlign = 'left';
    }

    // ---- OBSTACLE SPAWNING ----
    let spawnTimer = 0;
    let minSpawnInterval = 60;

    function spawnObstacle() {
        spawnTimer++;
        const interval = Math.max(minSpawnInterval, 100 - speed * 5);

        if (spawnTimer > interval + Math.random() * 40) {
            spawnTimer = 0;
            const rand = Math.random();
            if (score > 500 && rand < 0.2) {
                obstacles.push(createDino('flying'));
            } else if (score > 200 && rand < 0.4) {
                obstacles.push(createDino('big'));
            } else {
                obstacles.push(createDino('small'));
            }
        }
    }

    // ---- MAIN UPDATE ----
    function update() {
        frameCount++;
        speed = Math.min(MAX_SPEED, INITIAL_SPEED + score / 500);

        grady.update();

        obstacles.forEach(obs => { obs.x -= speed; });
        obstacles = obstacles.filter(obs => obs.x > -60);

        const gradyBox = grady.getHitbox();
        for (const obs of obstacles) {
            const obsBox = getObsHitbox(obs);
            if (checkCollision(gradyBox, obsBox)) {
                gameState = 'gameover';
                if (score > highScore) highScore = score;
                return;
            }
        }

        if (frameCount % 3 === 0) score++;

        clouds.forEach(cloud => {
            cloud.x -= speed * 0.2;
            if (cloud.x < -50) {
                cloud.x = 850;
                cloud.y = 20 + Math.random() * 60;
                cloud.size = 0.6 + Math.random() * 0.8;
            }
        });

        mountains.forEach(m => {
            m.x -= speed * 0.1;
            if (m.x < -120) {
                m.x = 850 + Math.random() * 100;
                m.h = 40 + Math.random() * 50;
            }
        });

        groundOffset -= speed;

        spawnDust();
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
        });
        particles = particles.filter(p => p.life > 0);

        spawnObstacle();
    }

    // ---- MAIN DRAW ----
    function draw() {
        ctx.clearRect(0, 0, 800, 300);

        if (gameState === 'start') {
            drawStartScreen();
            return;
        }

        drawSky();
        drawMountains();
        drawClouds();
        drawGround();
        drawParticles();

        obstacles.forEach(obs => drawDino(obs));
        grady.draw();
        drawScore();

        if (score > 0 && score % 100 < 3) {
            ctx.fillStyle = `rgba(255, 255, 255, ${0.3 - (score % 100) * 0.1})`;
            ctx.fillRect(0, 0, 800, 300);
        }

        if (gameState === 'gameover') {
            drawGameOver();
        }
    }

    // ---- GAME LOOP ----
    function gameLoop() {
        if (gameState === 'playing') {
            update();
        }
        draw();
        requestAnimationFrame(gameLoop);
    }

    // ---- INPUT ----
    function startGame() {
        gameState = 'playing';
        score = 0;
        speed = INITIAL_SPEED;
        obstacles = [];
        particles = [];
        spawnTimer = 0;
        frameCount = 0;
        grady.reset();
    }

    function handleAction(action) {
        if (action === 'jump') {
            if (gameState === 'start' || gameState === 'gameover') {
                startGame();
            } else if (gameState === 'playing') {
                grady.jump();
            }
        } else if (action === 'duck_start') {
            if (gameState === 'playing') {
                grady.duck(true);
            }
        } else if (action === 'duck_end') {
            grady.duck(false);
        }
    }

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            handleAction('jump');
        }
        if (e.code === 'ArrowDown') {
            e.preventDefault();
            handleAction('duck_start');
        }
    });

    document.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowDown') {
            handleAction('duck_end');
        }
    });

    // ---- TOUCH CONTROLS (on-screen buttons) ----
    // Jump button
    btnJump.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleAction('jump');
    }, { passive: false });

    btnJump.addEventListener('mousedown', (e) => {
        e.preventDefault();
        handleAction('jump');
    });

    // Duck button - hold to duck
    btnDuck.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (gameState === 'start' || gameState === 'gameover') {
            startGame();
        } else {
            handleAction('duck_start');
        }
    }, { passive: false });

    btnDuck.addEventListener('touchend', (e) => {
        e.preventDefault();
        handleAction('duck_end');
    }, { passive: false });

    btnDuck.addEventListener('touchcancel', (e) => {
        handleAction('duck_end');
    });

    btnDuck.addEventListener('mousedown', (e) => {
        e.preventDefault();
        if (gameState === 'start' || gameState === 'gameover') {
            startGame();
        } else {
            handleAction('duck_start');
        }
    });

    btnDuck.addEventListener('mouseup', () => {
        handleAction('duck_end');
    });

    // Canvas tap for jump (fallback for simple tapping on the game)
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleAction('jump');
    }, { passive: false });

    canvas.addEventListener('click', () => {
        handleAction('jump');
    });

    // Prevent iOS Safari bounce/zoom
    document.addEventListener('touchmove', (e) => {
        e.preventDefault();
    }, { passive: false });

    // Prevent double-tap zoom on iOS
    let lastTap = 0;
    document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTap < 300) {
            e.preventDefault();
        }
        lastTap = now;
    }, { passive: false });

    // Polyfill for roundRect
    if (!ctx.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (typeof r === 'number') r = [r];
            const [tl] = r;
            this.beginPath();
            this.moveTo(x + tl, y);
            this.lineTo(x + w - tl, y);
            this.quadraticCurveTo(x + w, y, x + w, y + tl);
            this.lineTo(x + w, y + h - tl);
            this.quadraticCurveTo(x + w, y + h, x + w - tl, y + h);
            this.lineTo(x + tl, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - tl);
            this.lineTo(x, y + tl);
            this.quadraticCurveTo(x, y, x + tl, y);
            this.closePath();
            return this;
        };
    }

    // Start the loop
    gameLoop();
    </script>
</body>
